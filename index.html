<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pase de Lista CBT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://unpkg.com/@zxing/library@latest"></script>

    <style>
        body { background-color: #f4f6f9; }
        .card { border: none; border-radius: 15px; max-width: 600px; margin: 0 auto; }
        .card-header {
            border-top-left-radius: 15px !important;
            border-top-right-radius: 15px !important;
            background-color: #0d6efd !important;
        }
        video { width: 100%; height: auto; border: 4px solid #0d6efd; border-radius: 15px; background-color: black; }
        .form-control-lg { text-align: center; font-weight: bold; font-size: 24px; color: #444; }
        .alert { font-size: 18px; padding: 15px; }
        .alert-duplicado { background-color: #fff3cd; color: #664d03; border-color: #ffecb5; }
    </style>
</head>
<body>

<div class="container py-4">
    <div class="card shadow">
        <div class="card-header text-white text-center">
            <h2>CBT No.1 "Lic. Adolfo López Mateos"</h2>
            <h5>Sistema de Pase de Lista</h5>
        </div>
        
        <div class="card-body">
            <div class="row mb-4">
                <div class="col-6">
                    <button id="btnCamara" class="btn btn-primary w-100" onclick="iniciarCamara()">
                        📷 Iniciar Cámara
                    </button>
                </div>
                <div class="col-6">
                    <button id="btnDetener" class="btn btn-danger w-100" onclick="detenerCamara()" disabled>
                        ⛔ Detener Cámara
                    </button>
                </div>
            </div>

            <div class="text-center mb-4">
                <video id="reader" autoplay muted playsinline></video>
            </div>

            <div class="mb-3 text-start">
                <label class="form-label fw-bold text-secondary">Matrícula</label>
                <input id="matricula" type="text" class="form-control form-control-lg" placeholder="Escanee o escriba la matrícula" autocomplete="off">
            </div>

            <div class="d-grid mb-4">
                <button class="btn btn-success btn-lg" onclick="registrar()">
                    ✔ Registrar Asistencia
                </button>
            </div>

            <div id="resultado" class="alert alert-secondary text-center fw-bold">
                Esperando lectura...
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // 🔴 REEMPLAZA ESTA URL CON TU NUEVA URL GENERADA EN EL PASO 1
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbw7gNYb_lA7vMqCAimcSB348dzoVSyBhd3K40h6ycUGySJQFal2AulhiOhnxUBp3xOSlA/exec";
// Configuramos el lector multiformato para habilitar códigos de barras lineales y QR


    // --- CONFIGURACIÓN DE LA PRUEBA ORIGINAL (FORZAR CÓDIGOS DE BARRAS) ---
    const hints = new Map();
    const formats = [
        ZXing.BarcodeFormat.CODE_128,
        ZXing.BarcodeFormat.CODE_39,
        ZXing.BarcodeFormat.EAN_13,
        ZXing.BarcodeFormat.EAN_8,
        ZXing.BarcodeFormat.UPC_A,
        ZXing.BarcodeFormat.UPC_E,
        ZXing.BarcodeFormat.ITF
    ];
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true); // Fuerza al procesador a enfocar líneas difíciles

    // Creamos el lector aplicando los mapas de formatos de barras nativos
    const codeReader = new ZXing.BrowserMultiFormatReader(hints);
    let codeReaderControls = null;
    const txtMatricula = document.getElementById("matricula");
    const divResultado = document.getElementById("resultado");
    let procesandoCodigo = false;

    async function iniciarCamara() {
        divResultado.className = "alert alert-info text-center fw-bold";
        divResultado.innerHTML = "Iniciando cámara trasera...";
        procesandoCodigo = false;
        
        try {
            const constraints = {
                video: {
                    facingMode: "environment",
                    advanced: [
                        { focusMode: "continuous" }, // Enfoque constante
                        { zoom: 1.0 }               // Zoom base estable
                    ]
                }
            };

            // Iniciar el escaneo continuo con la configuración pesada de barras
            codeReaderControls = await codeReader.decodeFromConstraints(constraints, 'reader', (result, error) => {
                if (result && !procesandoCodigo) {
                    procesandoCodigo = true; // Evita lecturas múltiples instantáneas
                    
                    const codigoDetectado = result.text.trim();
                    txtMatricula.value = codigoDetectado;
                    
                    divResultado.className = "alert alert-warning text-center fw-bold";
                    divResultado.innerHTML = "Código detectado: " + codigoDetectado + ". Procesando...";
                    
                    detenerCamara(); // Pausamos video mientras Google guarda el registro
                    registrar(); 
                }
            });

            document.getElementById("btnCamara").disabled = true;
            document.getElementById("btnDetener").disabled = false;
            divResultado.className = "alert alert-success text-center fw-bold";
            divResultado.innerHTML = "Lector de Credenciales Activo. Apunte al código de barras.";
        } catch (err) {
            console.error(err);
            divResultado.className = "alert alert-danger text-center fw-bold";
            divResultado.innerHTML = "❌ Error al abrir la cámara. Revisa los permisos.";
        }
    }

    function detenerCamara() {
        if (codeReaderControls) {
            codeReader.reset(); // Resetea el hardware de captura por completo
            codeReaderControls = null;
        }
        document.getElementById("btnCamara").disabled = false;
        document.getElementById("btnDetener").disabled = true;
    }

    function registrar() {
        const valorMatricula = txtMatricula.value.trim();
        if (!valorMatricula) {
            divResultado.className = "alert alert-danger text-center fw-bold";
            divResultado.innerHTML = "⚠️ Por favor, ingrese o escanee una matrícula.";
            procesandoCodigo = false;
            return;
        }

        divResultado.className = "alert alert-info text-center fw-bold";
        divResultado.innerHTML = "⏳ Guardando asistencia...";

        var datos = new URLSearchParams();
        datos.append('matricula', valorMatricula);

        fetch(URL_APPS_SCRIPT, {
            method: "POST",
            mode: "cors",
            body: datos
        })
        .then(response => response.json())
        .then(res => {
            divResultado.className = "alert text-center fw-bold";
            
            if (res.status === "success") {
                divResultado.classList.add("alert-success");
                txtMatricula.value = ""; // Limpiar casilla para el siguiente alumno
            } else if (res.status === "duplicado") {
                divResultado.classList.add("alert-duplicado");
            } else {
                divResultado.classList.add("alert-danger");
            }
            divResultado.innerHTML = res.message.replace(/\n/g, "<br>");

            // Espera 3 segundos mostrando el resultado en pantalla y reactiva el escáner
            setTimeout(iniciarCamara, 3000);
        })
        .catch(err => {
            divResultado.className = "alert alert-danger text-center fw-bold";
            divResultado.innerHTML = "❌ Error de conexión al guardar en la base de datos.";
            setTimeout(iniciarCamara, 3000);
        });
    }


    
</script>
</body>
</html>
