<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pase de Lista CBT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <script type="text/javascript" src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>

    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', sans-serif; }
        .card { border: none; border-radius: 15px; max-width: 600px; margin: 0 auto; }
        .card-header {
            border-top-left-radius: 15px !important;
            border-top-right-radius: 15px !important;
            background-color: #0056b3 !important; /* Azul Institucional */
        }
        #contenedor-camara { width: 100%; max-width: 450px; margin: 0 auto; background-color: black; border: 4px solid #0056b3; border-radius: 15px; overflow: hidden; position: relative; }
        video { width: 100%; height: auto; display: block; object-fit: cover; }
        .form-control-lg { text-align: center; font-weight: bold; font-size: 24px; color: #444; }
        .alert { font-size: 18px; padding: 15px; border-radius: 10px; }
        .alert-duplicado { background-color: #fff3cd; color: #664d03; border-color: #ffecb5; }
        
        /* Línea roja de guía para ayudar al usuario a centrar el código de barras */
        .linea-guia {
            position: absolute;
            top: 50%;
            left: 5%;
            width: 90%;
            height: 2px;
            background-color: red;
            box-shadow: 0 0 6px red;
            z-index: 10;
            transform: translateY(-50%);
        }
    </style>
</head>
<body>

<div class="container py-4">
    <div class="card shadow">
        <div class="card-header text-white text-center py-3">
            <h2 class="mb-1 fw-bold">CBT No.1 "Lic. Adolfo López Mateos"</h2>
            <h5 class="mb-0 text-white-50">Sistema de Pase de Lista</h5>
        </div>
        
        <div class="card-body">
            <div class="row mb-4 g-2">
                <div class="col-6">
                    <button id="btnCamara" class="btn btn-primary btn-lg w-100 fw-bold" onclick="iniciarCamara()">
                        📷 Iniciar Lector
                    </button>
                </div>
                <div class="col-6">
                    <button id="btnDetener" class="btn btn-danger btn-lg w-100 fw-bold" onclick="detenerCamara()" disabled>
                        ⛔ Detener
                    </button>
                </div>
            </div>

            <div class="text-center mb-4">
                <div id="contenedor-camara">
                    <div class="linea-guia"></div>
                    <video id="reader" autoplay muted playsinline></video>
                </div>
            </div>

            <div class="mb-3 text-start">
                <label class="form-label fw-bold text-secondary mb-1">Matrícula</label>
                <input id="matricula" type="text" class="form-control form-control-lg" placeholder="Escanee o escriba la matrícula" autocomplete="off">
            </div>

            <div class="d-grid mb-4">
                <button class="btn btn-success btn-lg" onclick="registrar()">
                    ✔ Registrar Asistencia
                </button>
            </div>

            <div id="resultado" class="alert alert-secondary text-center fw-bold mb-0">
                Esperando lectura...
            </div>
        </div>
    </div>
</div>

<script>
    // 🔴 PEGA AQUÍ TU URL DE GOOGLE APPS SCRIPT QUE YA FUNCIONA EN LA BASE DE DATOS:
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbw7gNYb_lA7vMqCAimcSB348dzoVSyBhd3K40h6ycUGySJQFal2AulhiOhnxUBp3xOSlA/exec";

    // --- CONFIGURACIÓN PARA FORZAR CÓDIGOS DE BARRAS ---
    const hints = new Map();
    const formats = [
        ZXing.BarcodeFormat.CODE_128,
        ZXing.BarcodeFormat.CODE_39,
        ZXing.BarcodeFormat.EAN_13,
        ZXing.BarcodeFormat.UPC_A
    ];
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true); // Obliga a procesar de forma estricta imágenes difíciles

    // Creamos el lector inyectando la configuración de códigos de barras
    const codeReader = new ZXing.BrowserMultiFormatReader(hints);
    let codeReaderControls = null;
    const txtMatricula = document.getElementById("matricula");
    const divResultado = document.getElementById("resultado");
    let procesandoCodigo = false;

    async function iniciarCamara() {
        divResultado.className = "alert alert-info text-center fw-bold";
        divResultado.innerHTML = "Iniciando lector de barras...";
        procesandoCodigo = false;
        
        // Añadimos parámetros avanzados para forzar autofoco y optimizar resolución en el celular
        const constraints = {
            video: {
                facingMode: "environment",
                width: { ideal: 1280 },
                height: { ideal: 720 },
                advanced: [{ focusMode: "continuous" }] // Fuerza enfoque continuo
            }
        };

        try {
            codeReaderControls = await codeReader.decodeFromConstraints(constraints, 'reader', (result, error) => {
                if (result && !procesandoCodigo) {
                    procesandoCodigo = true; // Bloquea lecturas en ráfaga
                    
                    const codigoDetectado = result.text.trim();
                    txtMatricula.value = codigoDetectado;
                    
                    divResultado.className = "alert alert-warning text-center fw-bold";
                    divResultado.innerHTML = "Código detectado: " + codigoDetectado + ". Procesando...";
                    
                    detenerCamara(); // Apaga la cámara temporalmente para registrar
                    registrar();
                }
            });

            document.getElementById("btnCamara").disabled = true;
            document.getElementById("btnDetener").disabled = false;
            divResultado.className = "alert alert-success text-center fw-bold";
            divResultado.innerHTML = "Lector de Barras Activo. Centre el código en la línea roja.";
        } catch (err) {
            console.error(err);
            divResultado.className = "alert alert-danger text-center fw-bold";
            divResultado.innerHTML = "❌ Error: Permiso de cámara denegado.";
        }
    }

    function detenerCamara() {
        if (codeReaderControls) {
            codeReader.reset(); // Resetea por completo el hardware de la cámara
            codeReaderControls = null;
        }
        document.getElementById("btnCamara").disabled = false;
        document.getElementById("btnDetener").disabled = true;
    }

    function registrar() {
        const valorMatricula = txtMatricula.value.trim();
        if (!valorMatricula) {
            divResultado.className = "alert alert-danger text-center fw-bold";
            divResultado.innerHTML = "⚠️ Por favor, ingrese o escanee una matrícula.";
            procesandoCodigo = false;
            return;
        }

        divResultado.className = "alert alert-info text-center fw-bold";
        divResultado.innerHTML = "⏳ Guardando asistencia en la base de datos...";

        var datos = new URLSearchParams();
        datos.append('matricula', valorMatricula);

        fetch(URL_APPS_SCRIPT, {
            method: "POST",
            mode: "cors",
            body: datos
        })
        .then(response => response.json())
        .then(res => {
            divResultado.className = "alert text-center fw-bold";
            
            if (res.status === "success") {
                divResultado.classList.add("alert-success");
                txtMatricula.value = ""; 
            } else if (res.status === "duplicado") {
                divResultado.classList.add("alert-duplicado");
            } else {
                divResultado.classList.add("alert-danger");
            }
            divResultado.innerHTML = res.message.replace(/\n/g, "<br>");

            // Esperar 3 segundos mostrando el resultado y reactivar la cámara de forma automática
            setTimeout(iniciarCamara, 3000);
        })
        .catch(err => {
            divResultado.className = "alert alert-danger text-center fw-bold";
            divResultado.innerHTML = "❌ Error de conexión con el servidor.";
            setTimeout(iniciarCamara, 3000);
        });
    }
</script>
</body>
</html>
